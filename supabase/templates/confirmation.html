<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Confirm your Sunday Ledger account</title>
  </head>
  <body>
    <h1>Sunday Ledger</h1>
    <h2>Confirm your Sunday Ledger account</h2>
    <p>Confirm your email, then choose your username and password.</p>
    <p>
      <a
        href="{{ if .RedirectTo }}{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email{{ else }}{{ .SiteURL }}/auth/confirm?flow=create-account&amp;token_hash={{ .TokenHash }}&amp;type=email{{ end }}"
        >Continue to Sunday Ledger</a
      >
    </p>
    <p>
      The page will ask you to confirm before using this one-time link. If you
      did not request this email, ignore it.
    </p>
  </body>
</html>
