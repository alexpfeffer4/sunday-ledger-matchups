name: Phase 8A database acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase8a-database-acceptance.yml"
      - ".github/actions/test-database/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8a-database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase8a-database:
    name: Clean migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply migrations and run database conformance
        uses: ./.github/actions/test-database

      - name: Stop disposable local database
        if: always()
        run: supabase stop --no-backup
