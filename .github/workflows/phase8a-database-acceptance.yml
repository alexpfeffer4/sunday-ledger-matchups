name: Phase 8A database acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase8a-database-acceptance.yml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8a-database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase8a-database:
    name: Clean migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0

      - name: Initialize disposable local configuration
        run: supabase init

      - name: Apply all migrations to a clean local database
        run: supabase db start

      - name: Run database policy and conformance tests
        run: supabase test db

      - name: Stop disposable local database
        if: always()
        run: supabase stop --no-backup
