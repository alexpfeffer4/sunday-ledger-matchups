name: Phase 8A browser acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase8a-browser-acceptance.yml"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "src/application/queries/get-live-playoff-state.ts"
      - "src/application/queries/live-playoff-dtos.ts"
      - "src/components/playoffs/**"
      - "src/components/history/**"
      - "src/app/l/**/playoffs/**"
      - "src/app/globals.css"
      - "src/design/tokens.css"
      - "tests/e2e/phase8a-*.tsx"
      - "tests/e2e/phase8a-*.ts"
      - "tests/fixtures/phase8a-playoff-state.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8a-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase8a-browser:
    name: Postseason reflow, privacy, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Render Phase 8A browser fixture
        run: npx vitest run tests/e2e/phase8a-markup.test.tsx

      - name: Run Phase 8A browser acceptance
        run: npx playwright test tests/e2e/phase8a-playoffs.spec.ts --project=desktop --reporter=github
