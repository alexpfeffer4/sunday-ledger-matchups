# Each data-bearing job owns a fresh runner and disposable stack.
# Preserve the full verification contract; no path-based suite selection yet.
name: Acceptance
"on":
  pull_request:
    branches:
      - main
      - codex/audit-stage7-deletion-guard
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality, unit tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Formatting, lint, strict types, unit/property tests, and build
        run: npm run verify
  database:
    name: Clean migrations, complete pgTAP, and generated types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Start fresh disposable acceptance stack
        uses: ./.github/actions/setup-acceptance
      - name: Run complete pgTAP and Phase 8C isolation suite
        run: bash scripts/run-disposable-database-tests.sh
      - name: Verify exact shared quote release function parity
        run: psql "$TEST_SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/operations/shared-odds-refresh-parity.sql
      - name: Verify automatic preparation repair body and privileges
        run: test "$(psql "$TEST_SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f supabase/operations/stage1-preparation-parity.sql)" = t
      - name: Verify disabled scheduler configuration on disposable database
        run: |
          psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction \
            -f supabase/operations/enable-score-checkpoints.sql \
            -c "DO \$\$ BEGIN
              IF (SELECT enabled FROM private.score_refresh_policy) THEN
                RAISE EXCEPTION 'Score automation must default to disabled';
              END IF;
              IF private.dispatch_score_checkpoints() IS NOT NULL THEN
                RAISE EXCEPTION 'Disabled dispatch must make no HTTP request';
              END IF;
              IF strpos(pg_get_functiondef('private.dispatch_score_checkpoints()'::regprocedure),
                'perform private.dispatch_player_result_checkpoints();')=0 THEN
                RAISE EXCEPTION 'Score initializer must preserve the tracked player hook';
              END IF;
              IF private.dispatch_player_result_checkpoints() IS NOT NULL THEN
                RAISE EXCEPTION 'Disabled player dispatch must make no HTTP request';
              END IF;
              IF has_function_privilege('authenticated', 'private.dispatch_score_checkpoints()', 'execute') THEN
                RAISE EXCEPTION 'Members must not invoke the scheduler';
              END IF;
            END \$\$;" \
            -c "SELECT cron.unschedule('sunday-ledger-score-checkpoints');"
      - name: Verify checked-in Phase 8C Supabase function types
        run: |
          supabase gen types typescript --local --schema api,public > /tmp/sunday-ledger-database.types.ts
          npm run types:supabase:check -- /tmp/sunday-ledger-database.types.ts
      - name: Retain disposable acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: database-acceptance
          path: |
            acceptance-reports/
            test-results/
          retention-days: 7
      - name: Stop disposable local database
        if: always()
        run: supabase stop --no-backup
  native:
    name: Native concurrency and retry safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Start fresh disposable acceptance stack
        uses: ./.github/actions/setup-acceptance
      - name: Verify standing season automation concurrency on native Postgres
        run: node scripts/verify-season-automation-concurrency.mjs
      - name: Clear committed automation fixtures before the legacy native gates
        run: supabase db reset --local --no-seed
      - name: Verify isolated source-smoke quota concurrency on native Postgres
        run: node scripts/verify-player-source-smoke-concurrency.mjs
      - name: Verify rolling submission concurrency on native Postgres
        run: node scripts/verify-rolling-concurrency.mjs
      - name: Verify recorded card reset concurrency on native Postgres
        run: node scripts/verify-card-reset-concurrency.mjs
      - name: Verify player-prop native concurrency
        run: node scripts/verify-player-props-concurrency.mjs
      - name: Verify player-result worker concurrency
        run: node scripts/verify-player-result-concurrency.mjs
      - name: Verify shared quote native concurrency
        run: node scripts/verify-quote-sharing-concurrency.mjs
      - name: Verify progressive player publication concurrency on native Postgres
        run: |
          supabase db reset --local --no-seed
          node scripts/verify-progressive-player-props-concurrency.mjs
      - name: Verify shared scheduled quote concurrency
        run: |
          supabase db reset --local --no-seed
          node scripts/verify-background-quotes-concurrency.mjs
      - name: Retain disposable acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-acceptance
          path: |
            acceptance-reports/
            test-results/
          retention-days: 7
      - name: Stop disposable local database
        if: always()
        run: supabase stop --no-backup
  full-stack:
    name: Real Auth and member journeys (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Start fresh disposable acceptance stack
        uses: ./.github/actions/setup-acceptance
      - name: Install full-stack browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build the production app against disposable Auth
        run: npm run build
      - name: Verify progressive availability and season automation
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: acceptance-reports/progressive-props.json
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/fixtures/card-quotes-provider-preload.mjs
        run: >-
          npx playwright test tests/e2e/progressive-player-props-full-stack.spec.ts --project=${{ matrix.project
          }} --workers=1 --reporter=github,json --output=test-results/progressive-props
      - name: Require zero skipped progressive availability tests
        run: node scripts/check-full-stack-report.mjs acceptance-reports/progressive-props.json
      - name: Isolate legacy Auth journeys from progressive source policy
        run: supabase db reset --local --no-seed
      - name: Verify authenticated scheduled quote updates
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: acceptance-reports/shared-odds.json
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/fixtures/card-quotes-provider-preload.mjs
        run: >-
          npx playwright test tests/e2e/shared-odds-full-stack.spec.ts --project=${{ matrix.project }}
          --workers=1 --reporter=github,json --output=test-results/shared-odds
      - name: Require zero skipped shared quote tests
        run: node scripts/check-full-stack-report.mjs acceptance-reports/shared-odds.json
      - name: Isolate legacy Auth journeys from scheduled quote fixtures
        run: supabase db reset --local --no-seed
      - name: Provision isolated entitled owner
        run: |
          OWNER_USER_ID="$(node scripts/provision-owner-rehearsal-acceptance.mjs)"
          if ! [[ "$OWNER_USER_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "Invalid disposable owner id" >&2
            exit 1
          fi
          psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
            "insert into private.owner_rehearsal_entitlements (user_id, note) values ('$OWNER_USER_ID'::uuid, 'Disposable CI owner');"
      - name: Run real Auth, server action, RSC, RPC, and authorization lane
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: acceptance-reports/desktop.json
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/fixtures/card-quotes-provider-preload.mjs
        run: >-
          npx playwright test tests/e2e/controlled-league-full-stack.spec.ts tests/e2e/owner-rehearsal-full-stack.spec.ts
          tests/e2e/card-quotes-full-stack.spec.ts tests/e2e/auth-email-full-stack.spec.ts tests/e2e/release-readiness-full-stack.spec.ts
          tests/e2e/rolling-submissions-full-stack.spec.ts tests/e2e/player-props-full-stack.spec.ts tests/e2e/card-reset-full-stack.spec.ts
          --project=desktop --workers=1 --reporter=github,json --output=test-results/desktop
        if: matrix.project == 'desktop'
      - name: Require zero skipped desktop full-stack tests
        run: node scripts/check-full-stack-report.mjs acceptance-reports/desktop.json
        if: matrix.project == 'desktop'
      - name: Verify real email authentication with mobile WebKit emulation
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: acceptance-reports/mobile-auth.json
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/fixtures/card-quotes-provider-preload.mjs
        run: >-
          npx playwright test tests/e2e/auth-email-full-stack.spec.ts --project=mobile --workers=1 --reporter=github,json
          --output=test-results/mobile-auth
        if: matrix.project == 'mobile'
      - name: Require zero skipped mobile Auth tests
        run: node scripts/check-full-stack-report.mjs acceptance-reports/mobile-auth.json
        if: matrix.project == 'mobile'
      - name: Measure mobile WebKit member release journey
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: acceptance-reports/mobile-member.json
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/fixtures/card-quotes-provider-preload.mjs
        run: >-
          npx playwright test tests/e2e/release-readiness-full-stack.spec.ts tests/e2e/rolling-submissions-full-stack.spec.ts
          tests/e2e/player-props-full-stack.spec.ts tests/e2e/controlled-league-full-stack.spec.ts tests/e2e/card-reset-full-stack.spec.ts
          --project=mobile --workers=1 --reporter=github,json --output=test-results/mobile-member
        if: matrix.project == 'mobile'
      - name: Require zero skipped mobile member tests
        run: node scripts/check-full-stack-report.mjs acceptance-reports/mobile-member.json
        if: matrix.project == 'mobile'
      - name: Retain disposable acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-stack-${{ matrix.project }}
          path: |
            acceptance-reports/
            test-results/
          retention-days: 7
      - name: Stop disposable local database
        if: always()
        run: supabase stop --no-backup
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
          - project: mobile
            browser: webkit
  stage1:
    name: Actual preparation and representative performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Start fresh disposable acceptance stack
        uses: ./.github/actions/setup-acceptance
      - name: Install baseline browser
        run: npx playwright install --with-deps chromium
      - name: Build unchanged production app against disposable Auth
        run: npm run build
      - name: Exercise actual preparation and measure desktop and mobile conditions
        env:
          STAGE1_BASELINE: "1"
          PLAYWRIGHT_JSON_OUTPUT_FILE: acceptance-reports/stage1.json
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/fixtures/card-quotes-provider-preload.mjs
        run: >-
          npx playwright test tests/e2e/stage1-baseline-full-stack.spec.ts --project=desktop
          --workers=1 --retries=0 --reporter=github,json --output=test-results/stage1
      - name: Require all preparation and baseline scenarios to execute
        run: node scripts/check-full-stack-report.mjs acceptance-reports/stage1.json
      - name: Summarize five-sample measurements
        run: node scripts/summarize-stage1-baseline.mjs
      - name: Retain Stage 1 raw observations and plans
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage1-baseline
          path: |
            acceptance-reports/
            test-results/
          retention-days: 7
      - name: Stop disposable local database
        if: always()
        run: supabase stop --no-backup
  browser:
    name: Shared participant UI on Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Render deterministic shared-UI fixtures
        run: >-
          npx vitest run tests/e2e/phase1-markup.test.tsx tests/e2e/phase8a-markup.test.tsx tests/e2e/phase8b-markup.test.tsx
          tests/e2e/phase8c-markup.test.tsx tests/e2e/phase10-markup.test.tsx tests/e2e/phase11-markup.test.tsx
          tests/e2e/audit-stage4-markup.test.tsx tests/e2e/phase6-markup.test.tsx tests/e2e/phase7-markup.test.tsx
      - name: Install bounded browser set
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium Phase 8 acceptance
        run: >-
          npx playwright test tests/e2e/phase8a-playoffs.spec.ts tests/e2e/phase8b-finality.spec.ts tests/e2e/phase8c-simulation.spec.ts
          tests/e2e/phase8-accessibility.spec.ts tests/e2e/phase10-navigation-records.spec.ts tests/e2e/phase11-identity.spec.ts
          tests/e2e/phase1-public.spec.tsx tests/e2e/phase3-practice-card.spec.ts tests/e2e/audit-stage4-presentation.spec.ts
          --project=desktop --reporter=github --output=test-results/shared-desktop
      - name: WebKit Phase 8 acceptance
        run: >-
          npx playwright test tests/e2e/phase8a-playoffs.spec.ts tests/e2e/phase8b-finality.spec.ts tests/e2e/phase8c-simulation.spec.ts
          tests/e2e/phase8-accessibility.spec.ts tests/e2e/phase10-navigation-records.spec.ts tests/e2e/phase11-identity.spec.ts
          tests/e2e/phase1-public.spec.tsx tests/e2e/phase3-practice-card.spec.ts tests/e2e/audit-stage4-presentation.spec.ts
          --project=webkit --reporter=github --output=test-results/shared-webkit
      - name: Matchup privacy and season history on all existing browser projects
        run: >-
          npx playwright test tests/e2e/phase6-paired-matchup.spec.tsx tests/e2e/phase7-weekly-close.spec.tsx
          --project=desktop --project=webkit --project=mobile --reporter=github --output=test-results/matchup-history
      - name: Retain disposable acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-ui-acceptance
          path: |
            acceptance-reports/
            test-results/
          retention-days: 7
  acceptance:
    name: Acceptance complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - quality
      - database
      - native
      - full-stack
      - browser
      - stage1
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Require successful results from every job group
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.mjs quality database native full-stack browser stage1
