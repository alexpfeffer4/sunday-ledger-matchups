name: Phase 8C authoritative Simulation acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase8c-acceptance.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-generated-supabase-types.mjs"
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-database:
    name: Clean quality, migration, pgTAP, and type gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Formatting, lint, strict types, unit/property tests, and build
        run: npm run verify

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.116.0

      - name: Initialize disposable local configuration
        run: supabase init

      - name: Start disposable Supabase stack and apply every migration
        run: supabase start

      - name: Export disposable full-stack configuration
        run: |
          supabase status -o env > /tmp/sunday-ledger-supabase.env
          set -a
          source /tmp/sunday-ledger-supabase.env
          set +a
          for required_name in API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Supabase did not export required local setting: $required_name" >&2
              exit 1
            fi
          done
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "OWNER_REHEARSAL_TEST_EMAIL=owner-rehearsal@acceptance.test" >> "$GITHUB_ENV"
          echo "OWNER_REHEARSAL_TEST_PASSWORD=Owner-Rehearsal-Acceptance-48!" >> "$GITHUB_ENV"
          echo "FULL_STACK_ACCEPTANCE=1" >> "$GITHUB_ENV"

      - name: Run complete pgTAP and Phase 8C isolation suite
        run: supabase test db

      - name: Verify checked-in Phase 8C Supabase function types
        run: |
          supabase gen types typescript --local --schema api,public > /tmp/sunday-ledger-database.types.ts
          npm run types:supabase:check -- /tmp/sunday-ledger-database.types.ts

      - name: Install full-stack browser
        run: npx playwright install --with-deps chromium

      - name: Provision isolated entitled owner
        run: |
          OWNER_USER_ID="$(node scripts/provision-owner-rehearsal-acceptance.mjs)"
          if ! [[ "$OWNER_USER_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "Invalid disposable owner id" >&2
            exit 1
          fi
          psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
            "insert into private.owner_rehearsal_entitlements (user_id, note) values ('$OWNER_USER_ID'::uuid, 'Disposable CI owner');"

      - name: Run real Auth, server action, RSC, RPC, and authorization lane
        run: >-
          npx playwright test
          tests/e2e/controlled-league-full-stack.spec.ts
          tests/e2e/owner-rehearsal-full-stack.spec.ts
          --project=desktop --reporter=github

      - name: Stop disposable local database
        if: always()
        run: supabase stop --no-backup

  browser:
    name: Shared participant UI on Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Render deterministic shared-UI fixtures
        run: >-
          npx vitest run
          tests/e2e/phase8a-markup.test.tsx
          tests/e2e/phase8b-markup.test.tsx
          tests/e2e/phase8c-markup.test.tsx
          tests/e2e/phase10-markup.test.tsx
          tests/e2e/phase11-markup.test.tsx

      - name: Install bounded browser set
        run: npx playwright install --with-deps chromium webkit

      - name: Chromium Phase 8 acceptance
        run: >-
          npx playwright test
          tests/e2e/phase8a-playoffs.spec.ts
          tests/e2e/phase8b-finality.spec.ts
          tests/e2e/phase8c-simulation.spec.ts
          tests/e2e/phase8-accessibility.spec.ts
          tests/e2e/phase10-navigation-records.spec.ts
          tests/e2e/phase11-identity.spec.ts
          --project=desktop --reporter=github

      - name: WebKit Phase 8 acceptance
        run: >-
          npx playwright test
          tests/e2e/phase8a-playoffs.spec.ts
          tests/e2e/phase8b-finality.spec.ts
          tests/e2e/phase8c-simulation.spec.ts
          tests/e2e/phase8-accessibility.spec.ts
          tests/e2e/phase10-navigation-records.spec.ts
          tests/e2e/phase11-identity.spec.ts
          --project=webkit --reporter=github
